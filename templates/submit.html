<!DOCTYPE html>
<html>

<head>
	<title>Tourney stats result</title>
	<style>
		table {
			font-family: arial, sans-serif;
			border-collapse: collapse;
			width: 100%;
		}

		td,
		th {
			border: 1px solid #aaaaaa;
			text-align: left;
			padding: 8px;
		}

		tr:nth-child(even) {
			background-color: #dddddd;
		}
	</style>
</head>

<body>
	<table id="scores">
		<tr>
			{% for item in fields%}
			<th>{{ item }}</th>
			{% endfor %}
		</tr>
		{% for player, scores in scores.items()%}
		<tr>
			<td>{{ player.username }}</td>
			{% for score in scores%}
			<td>{{ score.score }}</td>
			{% endfor %}
		</tr>
		{% endfor %}
	</table>
</body>

</html>
